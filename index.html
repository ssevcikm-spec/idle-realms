<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1a17" />
<title>Idle Realm</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/subtabs.css" />
<link rel="stylesheet" href="css/title_screen.css" />
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-item"><span class="hud-icon">⏱</span><span id="hud-time">0:00:00</span></div>
    <div class="hud-item"><span class="hud-icon">🪙</span><span id="hud-gold">0</span></div>
    <div class="hud-item"><span class="hud-icon">⭐</span><span id="hud-renown">0</span></div>
    <div class="hud-item"><span class="hud-icon">🧙</span><span id="hud-units">0</span></div>
    <div class="hud-item hud-prestige" id="hud-prestige" style="display:none"></div>
    <div class="hud-item hud-place" id="hud-place">—</div>
    <button id="hud-menu" class="hud-menu-btn" title="Menu — uložit, nová hra, obtížnost">☰</button>
  </header>
  <div id="hud-mats" class="hud-mats">
    <button id="mats-toggle" class="mats-toggle" title="Sbalit / rozbalit přehled surovin">▾</button>
    <span id="mats-summary" class="mats-summary"></span>
    <div class="mats-scroll" id="mats-scroll"></div>
  </div>
  <div id="we-bar"></div>

  <div id="world-wrap">
    <canvas id="world"></canvas>
    <div id="map-controls">
      <button class="map-btn" data-map="toggle-panel" id="panel-toggle" title="Sbalit / rozbalit panel">▾</button>
      <button class="map-btn" data-map="toggle-fullscreen" id="map-fullscreen-btn" title="Celoobrazovková mapa">⛶</button>
      <button class="map-btn" data-map="center">🎯</button>
      <button class="map-btn" data-map="base" id="base-btn" title="Základna — výběr místa / zobrazení">🏕️</button>
      <button class="map-btn" data-map="overview" title="Přehled světa / zpět do detailu">🔭</button>
      <button class="map-btn" data-map="zoom-in">＋</button>
      <button class="map-btn" data-map="zoom-out">−</button>
    </div>
    <div id="map-hint">Tažením posouváš • ťuknutím vybíráš</div>
    <div id="placement-hint" class="placement-hint" style="display:none">
      <span id="placement-hint-text">🏕️ Ťukni na mapu, kde založit základnu</span>
      <button class="btn-sm ghost" id="placement-cancel">Zrušit</button>
    </div>
  </div>

  <main id="panel">
    <div id="subtabs"></div>
    <div id="panel-content"></div>
  </main>

  <nav id="tabs">
    <button class="tab-btn" data-tab="world">🗺️<span>Svět</span><span class="tab-badge" id="tab-badge-orders" style="display:none"></span></button>
    <button class="tab-btn" data-tab="people">👥<span>Lidé</span></button>
    <button class="tab-btn" data-tab="craft">⚒️<span>Řemeslo</span></button>
    <button class="tab-btn" data-tab="economy">💰<span>Obchod</span></button>
    <button class="tab-btn" data-tab="more">📜<span>Více</span></button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/core/rng.js"></script>

<script src="js/data/sets.js"></script>

<script src="js/data/personality.js"></script>
<script src="js/data/ambitions.js"></script>
<script src="js/data/workshops.js"></script>
<script src="js/data/aging.js"></script>
<script src="js/data/abilities.js"></script>
<script src="js/data/synergies.js"></script>
<script src="js/data/politics.js"></script>
<script src="js/data/time.js"></script>
<script src="js/data/expeditions.js"></script>
<script src="js/data/unlocks.js"></script>
<script src="js/render/art.js"></script>

<script src="js/core/state.js"></script>
<script src="js/systems/units.js"></script>
