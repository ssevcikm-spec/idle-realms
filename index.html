<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1a17" />
<title>Idle Realm</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-item"><span class="hud-icon">⏱</span><span id="hud-time">0:00:00</span></div>
    <div class="hud-item"><span class="hud-icon">🪙</span><span id="hud-gold">0</span></div>
    <div class="hud-item"><span class="hud-icon">⭐</span><span id="hud-renown">0</span></div>
    <div class="hud-item"><span class="hud-icon">🧙</span><span id="hud-units">0</span></div>
    <div class="hud-item hud-prestige" id="hud-prestige" style="display:none"></div>
    <div class="hud-item hud-place" id="hud-place">—</div>
  </header>
  <div id="we-bar"></div>

  <div id="world-wrap">
    <canvas id="world"></canvas>
    <div id="map-controls">
      <button class="map-btn" data-map="toggle-panel" id="panel-toggle" title="Sbalit / rozbalit panel">▾</button>
      <button class="map-btn" data-map="toggle-fullscreen" id="map-fullscreen-btn" title="Celoobrazovková mapa">⛶</button>
      <button class="map-btn" data-map="center">🎯</button>
      <button class="map-btn" data-map="zoom-in">＋</button>
      <button class="map-btn" data-map="zoom-out">−</button>
    </div>
    <div id="map-hint">Tažením posouváš • ťuknutím vybíráš</div>
  </div>

  <main id="panel"></main>

  <nav id="tabs">
    <button class="tab-btn" data-tab="place">📍<span>Místo</span></button>
    <button class="tab-btn" data-tab="activities">⚒️<span>Práce</span></button>
    <button class="tab-btn" data-tab="groups">👥<span>Skupiny</span></button>
    <button class="tab-btn" data-tab="units">🧙<span>Postavy</span></button>
    <button class="tab-btn" data-tab="trade">🐎<span>Obchod</span></button>
    <button class="tab-btn" data-tab="craft">🔨<span>Výroba</span></button>
    <button class="tab-btn" data-tab="inventory">🎒<span>Batoh</span></button>
    <button class="tab-btn" data-tab="log">📜<span>Log</span></button>
  </nav>
</div>

<div id="modal-root"></div>

<script src="js/core/rng.js"></script>
<script src="js/data/world.js"></script>
<script src="js/data/character.js"></script>
<script src="js/data/combat.js"></script>
<script src="js/data/progress.js"></script>
<script src="js/data/personality.js"></script>
<script src="js/data/ambitions.js"></script>
<script src="js/data/workshops.js"></script>
<script src="js/data/aging.js"></script>
<script src="js/data/abilities.js"></script>
<script src="js/data/politics.js"></script>
<script src="js/data/time.js"></script>
<script src="js/data/expeditions.js"></script>
<script src="js/data/unlocks.js"></script>
<script src="js/render/art.js"></script>
<script src="js/core/state.js"></script>
<script src="js/systems/units.js"></script>
<script src="js/systems/groups.js"></script>
<script src="js/systems/psychology.js"></script>
<script src="js/systems/work.js"></script>
<script src="js/systems/combat.js"></script>
<script src="js/systems/abilities.js"></script>
<script src="js/systems/economy.js"></script>
<script src="js/systems/merchant.js"></script>
<script src="js/systems/crafting.js"></script>
<script src="js/systems/workshops.js"></script>
<script src="js/systems/misc.js"></script>
<script src="js/systems/drops.js"></script>
<script src="js/systems/events.js"></script>
<script src="js/systems/autonomy.js"></script>
<script src="js/systems/aging.js"></script>
<script src="js/systems/politics.js"></script>
<script src="js/systems/dynasty.js"></script>
<script src="js/systems/time.js"></script>
<script src="js/systems/expeditions.js"></script>
<script src="js/systems/journal.js"></script>
<script src="js/systems/prestige.js"></script>
<script src="js/render/world.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/trade.js"></script>
<script src="js/ui/base_panel.js"></script>
<script src="js/ui/achievements_panel.js"></script>
<script src="js/ui/combat_modal.js"></script>
<script src="js/ui/merchant_panel.js"></script>

<script src="js/main.js"></script>
</body>
</html>
